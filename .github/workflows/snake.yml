name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *" 
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: sinhaasneha
          outputs: |
            ./snake.svg
            ./snake-dark.svg

      - name: Push Files
        uses: EndBug/add-and-commit@v9
        with:
          add: "*.svg"
          message: "Generate snake animation"
